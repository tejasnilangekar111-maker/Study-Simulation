spring:
  application:
    name: study-simulation
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/study_simulation}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update # dev convenience only; application-prod.yml overrides this to `validate`
    show-sql: false
    open-in-view: false
  flyway:
    enabled: false # dev convenience only; application-prod.yml enables Flyway and requires
                    # db/migration/V1__init_schema.sql to be reviewed against the live schema first.
                    # Activate the prod profile with SPRING_PROFILES_ACTIVE=prod.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8081}

jwt:
  # No insecure fallback on purpose: the app must fail to start rather than silently
  # sign tokens with a known/default secret. Set JWT_SECRET (openssl rand -base64 48).
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  password-reset:
    token-expiry-minutes: ${RESET_TOKEN_EXPIRY_MINUTES:30}
    frontend-url: ${FRONTEND_ORIGIN:http://localhost:5173}
  admin:
    # Leave blank to disable the "new user registered" admin notification email.
    notification-email: ${ADMIN_NOTIFICATION_EMAIL:}
